[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-minervini-screener"
version = "0.1.0"
description = "Indian market stock screener using Minervini-inspired trend and VCP rules."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cursor Agent" }]
dependencies = []

[project.optional-dependencies]
live = ["yfinance"]

[project.scripts]
indian-minervini = "minervini_india.cli:main"

[tool.setuptools.packages.find]
include = ["minervini_india*"]
exclude = ["tests*", "examples*", "results*", "scripts*"]
